# SUNavigator configuration. See README/ucm.conf.spec.
# Override in local/ucm.conf. Secrets (GitHub token) belong in storage/passwords,
# realm "sunavigator", name "github_token" - never in this file.

[provider:fenre]
enabled = true
remote_sync_enabled = true
owner = fenre
repo = splunk-monitoring-use-cases
ref = main
allowed_refs = main
api_base = https://api.github.com
raw_base = https://raw.githubusercontent.com
content_root = content
schema_path = schemas/uc.schema.json
version_path = VERSION
allowed_hosts =
fetch_concurrency = 4
timeout = 30
max_attempts = 4
proxy_url =
ca_bundle =

[sync]
schedule_interval_hours = 0
job_timeout_seconds = 3600
max_invalid_ratio = 0.2

[import]
max_bundle_mb = 50

[controltest]
index = ucm_controltest

[catalog]
max_page_size = 100
max_join_keys = 2000
kv_row_limit = 50000

[interactive_search]
enabled = true

[discovery]
earliest = -7d
latest = now
include_internal = false
max_pairs = 5000
search_timeout_seconds = 120
job_timeout_seconds = 600
schedule_interval_hours = 0
populated_check = true
populated_max_models = 30
populated_timeout_seconds = 30
freshness_days = 30

[readiness]
auto_assess = true
stale_hours = 24
ready_threshold = 90
partial_threshold = 50
min_coverage = 0.5
job_timeout_seconds = 3600

[validation]
earliest = -15m
latest = now
preview_max_events = 50
preview_timeout_seconds = 30
sample_events = 200
sample_timeout_seconds = 30
sample_window_minutes = 60

[spl]
extra_safe_commands =

[deployment]
require_approval = true
allow_self_approval = false
block_enable_states = blocked
default_cron = */15 * * * *
default_earliest = -20m@m
default_latest = -5m@m
default_schedule_window = auto
default_alert_mode = track
scheduled_owner =
max_revisions = 20
cron_jitter = true
verify_interval_minutes = 60

[retention]
audit_days = 365
job_history = 50
interval_hours = 24

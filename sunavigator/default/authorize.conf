# App capabilities and roles. Role mapping: docs/SECURITY.md.

[capability::ucm_manage_content]
[capability::ucm_run_discovery]
[capability::ucm_deploy]
[capability::ucm_admin]

[role_ucm_viewer]
importRoles = user

[role_ucm_analyst]
importRoles = ucm_viewer
ucm_run_discovery = enabled

[role_ucm_content_manager]
importRoles = ucm_analyst
ucm_manage_content = enabled

[role_ucm_deployment_operator]
importRoles = ucm_analyst
ucm_deploy = enabled

# Owner of every deployed saved search (D-051). Assign it to one dedicated
# account and set [deployment] scheduled_owner to that account's name. It has
# no UI role of its own; it runs searches with the rights of this role.
# It does not import "user": a role cannot disable a capability it imports, and
# "user" grants run_collect, output_file, run_dump and run_sendalert (D-068).
[role_ucm_scheduler]
search = enabled
schedule_search = enabled
get_metadata = enabled
input_file = enabled
list_metrics_catalog = enabled
run_custom_command = enabled
run_collect = disabled
run_mcollect = disabled
srchIndexesAllowed = *
srchIndexesDefault = main

[role_ucm_admin]
importRoles = ucm_content_manager;ucm_deployment_operator
ucm_run_discovery = enabled
ucm_admin = enabled

[role_admin]
ucm_manage_content = enabled
ucm_run_discovery = enabled
ucm_deploy = enabled
ucm_admin = enabled

[role_sc_admin]
ucm_manage_content = enabled
ucm_run_discovery = enabled
ucm_deploy = enabled
ucm_admin = enabled

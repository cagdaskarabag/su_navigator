[script:ucm_api]
match = /ucm
script = ucm_rest.py
scripttype = persist
handler = ucm_rest.UcmRestHandler
requireAuthentication = true
output_modes = json
passPayload = true
passHttpHeaders = false
passHttpCookies = false
# The system token is used only to append audit records and read the provider
# secret for capability-gated operations (docs/DECISIONS.md D-011).
passSystemAuth = true
python.version = python3
python.required = 3.9, 3.13

[default]
dispatch.earliest_time = -24h
dispatch.latest_time = now

[ESCU - Disable Windows Defender Real-time Protection - Rule]
action.correlationsearch.annotations = {"analytic_story": ["Windows Defender Tampering"], "cis20": ["CIS 8"], "cve": [], "data_source": ["Sysmon EventID 13"], "kill_chain_phases": ["Actions on Objectives"], "mitre_attack": ["T1562.001"], "nist": ["PR.PT"], "type": "TTP", "type_list": ["TTP"]}
action.correlationsearch.detection_type = ebd
action.correlationsearch.enabled = 1
action.correlationsearch.label = ESCU - Disable Windows Defender Real-time Protection - Rule
action.correlationsearch.metadata = {"deprecated":"0","detection_id":"11111111-2222-4333-8444-555555555501","detection_version":"3","publish_time":1780876800.0}
action.notable = 1
action.notable.param.rule_title = Defender real-time protection disabled on $dest$
action.notable.param.security_domain = endpoint
action.notable.param.severity = high
action.risk = 1
action.risk.param._risk_score = 0
cron_schedule = 0 * * * *
description = Detects commands that turn off Windows Defender real-time protection.
disabled = 1
dispatch.earliest_time = -70m@m
dispatch.latest_time = -10m@m
is_scheduled = 1
search = | tstats `security_content_summariesonly` count from datamodel=Endpoint.Processes where Processes.process="*DisableRealtimeMonitoring*" by Processes.dest, Processes.user \
    | `drop_dm_object_name(Processes)` \
    | eval risk = "high"
schedule_window = auto

[ESCU - Suspicious Outbound Port Scan - Rule]
action.correlationsearch.annotations = {"analytic_story": ["Network Scanning"], "data_source": ["Palo Alto Network Threat"], "kill_chain_phases": ["Reconnaissance"], "mitre_attack": ["T1046"], "type": "Hunting", "type_list": ["Hunting"]}
action.correlationsearch.detection_type = ebd
action.correlationsearch.enabled = 1
action.correlationsearch.label = ESCU - Suspicious Outbound Port Scan - Rule
action.correlationsearch.metadata = {"deprecated":"0","detection_id":"11111111-2222-4333-8444-555555555502","detection_version":"1","publish_time":1780876800.0}
action.notable = 1
action.notable.param.security_domain = network
action.notable.param.severity = informational
cron_schedule = */15 * * * *
description = Finds hosts contacting many distinct destination ports.
disabled = 1
dispatch.earliest_time = -20m@m
dispatch.latest_time = now
search = index=firewall sourcetype=pan:traffic action=allowed \
    | stats dc(dest_port) AS ports by src_ip \
    | where ports > 100
schedule_window = auto

[ESCU - Repeated Failed Logons - Rule]
action.correlationsearch.annotations = {"analytic_story": ["Brute Force", "Windows Account Discovery"], "data_source": ["Windows Event Log Security 4625"], "kill_chain_phases": ["Exploitation"], "mitre_attack": ["T1110.001", "T1110"], "type": "TTP", "type_list": ["TTP"]}
action.correlationsearch.detection_type = ebd
action.correlationsearch.enabled = 1
action.correlationsearch.label = ESCU - Repeated Failed Logons - Rule
action.correlationsearch.metadata = {"deprecated":"0","detection_id":"11111111-2222-4333-8444-555555555503","detection_version":"7","publish_time":1780876800.0}
action.notable = 1
action.notable.param.security_domain = identity
action.notable.param.severity = medium
cron_schedule = 5 * * * *
description = Repeated failed logons from one source.
disabled = 1
search = index=wineventlog EventCode=4625 | stats count by src_user | where count > 10
schedule_window = auto

[ESCU - Old Detection - Rule]
action.correlationsearch.annotations = {"analytic_story": ["Legacy"], "mitre_attack": ["T1059.001"], "type": "TTP"}
action.correlationsearch.detection_type = ebd
action.correlationsearch.enabled = 0
action.correlationsearch.label = ESCU - Old Detection - Rule
action.correlationsearch.metadata = {"deprecated":"1","detection_id":"11111111-2222-4333-8444-555555555504","detection_version":"2","publish_time":1700000000.0}
description = Retired detection kept for history.
disabled = 1
search = index=main | head 1

[ESCU - Encoded PowerShell Without Domain - Rule]
action.correlationsearch.annotations = {"analytic_story": ["Malicious PowerShell"], "mitre_attack": ["T1059.001", "T1027"], "type": "TTP"}
action.correlationsearch.detection_type = ebd
action.correlationsearch.enabled = 1
action.correlationsearch.label = ESCU - Encoded PowerShell Without Domain - Rule
action.correlationsearch.metadata = {"deprecated":"0","detection_id":"11111111-2222-4333-8444-555555555505","detection_version":"4","publish_time":1780876800.0}
cron_schedule = 30 * * * *
description = Encoded PowerShell command lines.
disabled = 1
search = index=main sourcetype=XmlWinEventLog:Microsoft-Windows-Sysmon/Operational EventCode=1 CommandLine="*-enc*" \
    | table _time host CommandLine
schedule_window = auto

[Saved search that is not a detection]
description = Plain saved search with no correlation metadata.
search = index=_internal | head 1

# KV Store collections. Schema: docs/ARCHITECTURE.md section 5.
# Provider-owned: uc_catalog, uc_content, uc_categories. Operational: uc_sync_state, uc_audit.
# Collections for later work packages are declared when their services ship.
# Multi-valued fields (domains, tags, sourcetypes, mitre_ids, ...) are JSON arrays
# of strings declared as string: collections.conf has no array type, and with
# enforceTypes = false the KV Store stores and matches them as arrays.

[uc_catalog]
enforceTypes = false
replicate = false
field.content_id = string
field.provider = string
field.record_id = string
field.title = string
field.summary = string
field.domains = string
field.category_key = string
field.category_name = string
field.subcategory = string
field.criticality = string
field.criticality_rank = number
field.difficulty = string
field.monitoring_types = string
field.products = string
field.tags = string
field.sourcetypes = string
field.indexes = string
field.datamodels = string
field.addons = string
field.mitre_ids = string
field.frameworks = string
field.has_spl = bool
field.review_status = string
field.provider_status = string
field.provider_version = string
field.source_hash = string
field.source_blob_sha = string
field.normalizer_version = string
field.imported_at = string
field.sort_key = string
field.search_text = string
accelerated_fields.by_sort = {"provider_status": 1, "sort_key": 1}
accelerated_fields.by_category = {"category_key": 1, "provider_status": 1}
accelerated_fields.by_criticality = {"provider_status": 1, "criticality_rank": -1, "sort_key": 1}

[uc_content]
enforceTypes = false
replicate = false
field.content_id = string
field.provider = string
field.record_id = string
field.category_key = string
field.normalizer_version = string
field.source_hash = string
accelerated_fields.by_category = {"category_key": 1}

[uc_categories]
enforceTypes = false
replicate = false
field.provider = string
field.category_id = string
field.name = string
field.sort_order = number
field.imported_count = number
field.last_sync_status = string
field.last_sync_at = string
field.tree_sha = string

[uc_sync_state]
enforceTypes = false
replicate = false
field.doc_type = string
field.provider = string
field.status = string
field.source = string
field.requested_by = string
field.requested_at = string
field.started_at = string
field.finished_at = string
accelerated_fields.by_type_time = {"doc_type": 1, "requested_at": -1}

[uc_audit]
enforceTypes = false
replicate = false
field.time = number
field.time_iso = string
field.actor = string
field.action = string
field.object_type = string
field.object_id = string
field.outcome = string
accelerated_fields.by_time = {"time": -1}

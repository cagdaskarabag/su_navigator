# Read-only KV Store lookups used by native dashboard panels.

[ucm_catalog_lookup]
external_type = kvstore
collection = uc_catalog
case_sensitive_match = true
fields_list = _key, content_id, provider, record_id, title, domains, category_key, category_name, subcategory, criticality, criticality_rank, difficulty, monitoring_types, sourcetypes, datamodels, mitre_ids, frameworks, has_spl, review_status, provider_status, provider_version, imported_at

[ucm_categories_lookup]
external_type = kvstore
collection = uc_categories
fields_list = _key, provider, category_id, name, sort_order, imported_count, upstream_count, last_sync_status, last_sync_at, provider_version, source_ref

[ucm_sync_state_lookup]
external_type = kvstore
collection = uc_sync_state
fields_list = _key, doc_type, provider, job_id, source, status, requested_by, requested_at, started_at, finished_at, provider_version, source_ref, schema_version, last_good_version, last_good_ref, last_success_at, last_attempt_at, last_attempt_status, requested_ref

[ucm_audit_lookup]
external_type = kvstore
collection = uc_audit
fields_list = _key, time, time_iso, actor, action, object_type, object_id, outcome
